<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый заказ | RetailCRM Mockup</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-app: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        
        body { display: flex; height: 100vh; background-color: var(--bg-app); color: var(--text-main); }

        /* Sidebar */
        .sidebar { width: 70px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; align-items: center; padding-top: 20px; flex-shrink: 0; }
        .sidebar-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--sidebar-text); margin-bottom: 15px; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
        .sidebar-icon:hover, .sidebar-icon.active { background-color: #334155; color: #fff; }
        .sidebar-icon.active { border-left: 3px solid var(--primary); }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .header-title { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .badge { font-size: 0.75rem; background: #e0e7ff; color: var(--primary); padding: 2px 8px; border-radius: 12px; }
        .actions { display: flex; gap: 10px; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-danger-text { color: var(--danger); background: transparent; padding: 4px 8px; }
        .btn-danger-text:hover { background: #fef2f2; }

        /* Workspace */
        .workspace { flex: 1; padding: 24px; overflow-y: auto; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }

        /* Cards */
        .card { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
        .card-header { font-size: 1rem; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; color: var(--text-secondary); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }

        /* Form Elements */
        .form-group { margin-bottom: 16px; position: relative; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-input, .form-select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; transition: 0.2s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Autocomplete Mock */
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 10; display: none; }
        .autocomplete-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
        .autocomplete-item:hover { background: #f9fafb; }
        .autocomplete-item strong { display: block; color: var(--text-main); }
        .autocomplete-item span { font-size: 0.8rem; color: var(--text-secondary); }

        /* Product Table */
        .product-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .product-table th { text-align: left; font-size: 0.8rem; color: var(--text-secondary); padding: 8px; border-bottom: 1px solid var(--border); }
        .product-table td { padding: 10px 8px; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem; }
        .product-table td.align-right { text-align: right; }
        .product-input { width: 70px; padding: 4px; text-align: center; }
        
        /* Right Column (Totals) */
        .totals-block { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .total-row { display: flex; justify-content: space-between; font-size: 0.95rem; }
        .total-row.grand { font-weight: 700; font-size: 1.2rem; color: var(--text-main); margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--border); }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: #fff; width: 500px; border-radius: 8px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }

        .stock-tag { font-size: 0.75rem; color: var(--success); background: #ecfdf5; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    </style>
</head>

    <script>
        // --- MOCK LOGIC FOR UC-1 ---

        // 1. Client Search Simulation
        const clientsDB = [
            { name: "Иванов Иван Иванович", email: "ivan@example.com", phone: "+7 (999) 111-22-33" },
            { name: "ООО 'Ромашка'", email: "info@romashka.ru", phone: "+7 (495) 000-00-01" }
        ];

        function searchClient(val) {
            const dropdown = document.getElementById('clientDropdown');
            if (val.length < 2) { dropdown.style.display = 'none'; return; }

            const filtered = clientsDB.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
            dropdown.innerHTML = '';
            
            if (filtered.length > 0) {
                dropdown.style.display = 'block';
                filtered.forEach(client => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.innerHTML = `<strong>${client.name}</strong><span>${client.phone}</span>`;
                    div.onclick = () => selectClient(client);
                    dropdown.appendChild(div);
                });
            } else {
                // UC-1 Alt Flow A1: If not found, user might want to create new
                dropdown.style.display = 'block';
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `<strong>+ Создать нового клиента</strong><span>На основе введенных данных</span>`;
                div.onclick = () => alert('Переход к форме создания клиента (UC-2)');
                dropdown.appendChild(div);
            }
        }

        function selectClient(client) {
            document.getElementById('clientSearch').value = client.name;
            document.getElementById('clientSearch').disabled = true; // Lock selection
            document.getElementById('clientEmail').value = client.email;
            document.getElementById('clientPhone').value = client.phone;
            document.getElementById('clientDropdown').style.display = 'none';
        }

        // 2. Product Modal Logic
        function openProductModal() {
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        // 3. Cart Logic
        let cart = [];

        function addProductToCart(name, price, stock) {
            // UC-1 Step 5.3 Check Stock
            // (Simplified here, usually checking if adding exceeds stock)
            
            const existing = cart.find(item => item.name === name);
            if (existing) {
                if (existing.qty + 1 > stock) {
                    alert(`Внимание! Недостаточно товара на складе. Доступно: ${stock}`);
                    return;
                }
                existing.qty++;
            } else {
                cart.push({ name, price, qty: 1, discount: 0, stock });
            }
            renderCart();
            closeProductModal();
        }

        function updateQty(index, val) {
            const qty = parseInt(val);
            if (qty > cart[index].stock) {
                alert('Недостаточно на складе!');
                renderCart(); // reset visual
                return;
            }
            cart[index].qty = qty > 0 ? qty : 1;
            renderCart();
        }

        function updateDiscount(index, val) {
            cart[index].discount = parseFloat(val) || 0;
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartItems');
            tbody.innerHTML = '';
            
            let subtotal = 0;
            let totalDiscount = 0;

            cart.forEach((item, index) => {
                const rowSum = item.price * item.qty;
                const discountAmount = rowSum * (item.discount / 100);
                const finalSum = rowSum - discountAmount;

                subtotal += rowSum;
                totalDiscount += discountAmount;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.price.toLocaleString()} ₽</td>
                    <td><input type="number" class="form-input product-input" value="${item.qty}" onchange="updateQty(${index}, this.value)"></td>
                    <td><input type="number" class="form-input product-input" value="${item.discount}" min="0" max="100" onchange="updateDiscount(${index}, this.value)"></td>
                    <td class="align-right"><strong>${finalSum.toLocaleString()} ₽</strong></td>
                    <td><button class="btn-danger-text" onclick="removeItem(${index})"></button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('subtotal').innerText = subtotal.toLocaleString() + ' ₽';
            document.getElementById('discountTotal').innerText = '-' + totalDiscount.toLocaleString() + ' ₽';
            document.getElementById('grandTotal').innerText = (subtotal - totalDiscount).toLocaleString() + ' ₽';
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target == modal) {
                closeProductModal();
            }
        }
    </script>
</body>
</html>
