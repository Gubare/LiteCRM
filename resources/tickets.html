<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обращения - CRM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .btn-action { padding: 4px 8px; margin: 0 2px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete { background: #fef2f2; border-color: #ef4444; color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: white; }
        .btn-edit { background: #eff6ff; border-color: #3b82f6; color: #3b82f6; }
        .btn-edit:hover { background: #3b82f6; color: white; }
        .status-open { color: #d97706; font-weight: bold; }
        .status-done { color: #059669; font-weight: bold; }
        .status-archive { color: #6b7280; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full-width { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav class="main-nav">
    <a href="index.html"><span class="nav-icon">🏠</span> <span class="nav-text">Главная</span></a>
    <a href="clients.html"><span class="nav-icon">👥</span> <span class="nav-text">Клиенты</span></a>
    <a href="products.html"><span class="nav-icon">📦</span> <span class="nav-text">Товары</span></a>
    <a href="tickets.html"><span class="nav-icon">🎫</span> <span class="nav-text">Обращения</span></a>
    <a href="reports.html"><span class="nav-icon">📈</span> <span class="nav-text">Отчёты</span></a>
    <a href="sales.html"><span class="nav-icon">💰</span> <span class="nav-text">Продажи</span></a>
    <a href="settings.html"><span class="nav-icon">⚙️</span> <span class="nav-text">Настройки</span></a>
</nav>
    <main class="page-content">

    <h1>Управление обращениями</h1>
    
    <!-- Форма создания -->
    <form id="ticketForm" style="background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <div class="grid-2">
            <div>
                <label>Клиент:</label>
                <select id="ticketClient" class="full-width" required>
                    <option value="empty">Оставить пустым</option>
                    <option value="new">➕ Создать нового клиента</option>
                    <!-- Клиенты загрузятся сюда -->
                </select>
            </div>
            <div>
                <label>Тип обращения:</label>
                <select id="ticketType" class="full-width" required>
                    <option value="Вопрос">Вопрос</option>
                    <option value="Жалоба">️Жалоба</option>
                    <option value="Заказ">Заказ</option>
                    <option value="Консультация">Консультация</option>
                </select>
            </div>
        </div>
        <div class="grid-2">
            <div>
                <label>Контакт для ответа:</label>
                <input type="text" id="ticketContact" class="full-width" placeholder="Телефон / Email / Telegram">
            </div>
            <div>
                <label>Статус:</label>
                <select id="ticketStatus" class="full-width">
                    <option value="open">Открыта</option>
                    <option value="done">Выполнена</option>
                    <option value="archive">Архив</option>
                </select>
            </div>
        </div>
        <div>
            <label>Подробное описание:</label>
            <textarea id="ticketDesc" class="full-width" rows="3" placeholder="Суть вопроса или задачи..."></textarea>
        </div>
        <button type="submit" id="btnAddTicket" class="btn-action btn-edit" style="margin-top: 10px;">Создать обращение</button>
    </form>
    
    <div id="message"></div>
    
    <!-- Таблица -->
<h2>Все обращения</h2>
<table id="ticketList" class="crm-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Клиент</th>
            <th>Тип</th>
            <th>Контакт</th>
            <th>Описание</th>
            <th>Дата</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
    
    <!-- Модальное окно редактирования -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; margin: 50px auto; padding: 20px; border-radius: 8px; width: 600px; max-width: 95%;">
            <h3>Редактировать обращение</h3>
            <input type="hidden" id="editTicketId">
            <div class="grid-2">
                <div><label>Клиент:</label><select id="editClient" class="full-width"></select></div>
                <div><label>Тип:</label><select id="editType" class="full-width">
                    <option value="Вопрос">Вопрос</option><option value="Жалоба">Жалоба</option>
                    <option value="Заказ">Заказ</option><option value="Консультация">Консультация</option>
                </select></div>
            </div>
            <div class="grid-2">
                <div><label>Контакт:</label><input type="text" id="editContact" class="full-width"></div>
                <div><label>Статус:</label><select id="editStatus" class="full-width">
                    <option value="open">Открыта</option><option value="done">Выполнена</option><option value="archive">Архив</option>
                </select></div>
            </div>
            <div><label>Описание:</label><textarea id="editDesc" class="full-width" rows="3"></textarea></div>
            <div style="text-align: right; margin-top: 15px;">
                <button id="btnCloseModal" class="btn-action">Отмена</button>
                <button id="btnSaveEdit" class="btn-action btn-edit">Сохранить</button>
            </div>
        </div>
    </div>
</main>
    
    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/ticket.js"></script>
    <script type="module" src="js/main.js"></script>
    
    <script type="module">
        import { loadTickets, loadClientsForDropdown, createTicket, updateTicket, deleteTicket } from './js/ticket.js';

        if (typeof Neutralino !== 'undefined') Neutralino.init();

        window.renderTicketTable = renderTicketTable;
        window.deleteTicketById = deleteTicketById;
        window.editTicket = editTicket;
        window.closeEditModal = closeEditModal;
        window.saveEditTicket = saveEditTicket;

        document.addEventListener('DOMContentLoaded', async () => {
            await waitForDatabase();
            await loadAndRender();
            setupEventDelegation();
            populateClientDropdowns();
        });

        async function waitForDatabase() {
            if (window.isDatabaseReady) return;
            return new Promise(resolve => {
                const check = () => window.isDatabaseReady ? resolve() : setTimeout(check, 50);
                check();
            });
        }

        async function loadAndRender() {
            try {
                const tickets = await loadTickets();
                renderTicketTable(tickets);
            } catch (error) { console.error('Error loading tickets:', error); }
        }

        async function populateClientDropdowns() {
            const clients = await loadClientsForDropdown();
            const mainSelect = document.getElementById('ticketClient');
            const editSelect = document.getElementById('editClient');
            
            // Сохраняем первые 2 опции
            const specialOptions = mainSelect.innerHTML;
            
            const clientOptions = clients.map(c => 
                `<option value="${c.id}">${c.name} (${c.phone || c.email || 'Нет контакта'})</option>`
            ).join('');
            
            mainSelect.innerHTML = specialOptions + clientOptions;
            editSelect.innerHTML = '<option value="empty">Пусто</option>' + clientOptions;
        }

        // Обработчик формы
        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnAddTicket');
            if (btn.disabled) return;
            btn.disabled = true; btn.textContent = '⏳ Создание...';

            try {
                const formData = {
                    client_id: document.getElementById('ticketClient').value,
                    type: document.getElementById('ticketType').value,
                    contact: document.getElementById('ticketContact').value,
                    description: document.getElementById('ticketDesc').value,
                    status: document.getElementById('ticketStatus').value
                };

                // Обработка "+Создать клиента"
                if (formData.client_id === 'new') {
                    if (confirm('Перейти на страницу создания клиента?')) {
                        window.location.href = 'clients.html';
                        return;
                    } else {
                        formData.client_id = 'empty'; // Если отказался
                    }
                }

                await createTicket(formData);
                if (window.saveDataToFile) await window.saveDataToFile();
                
                e.target.reset();
                const tickets = await loadTickets();
                renderTicketTable(tickets);
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Создать обращение';
            }
        });

        function renderTicketTable(tickets) {
            const tbody = document.querySelector('#ticketList tbody');
            if (!tbody) return;
            
            if (tickets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 40px; color: #94a3b8;">📭 Нет обращений</td></tr>';
                return;
            }
            
            tbody.innerHTML = tickets.map(t => {
                let statusClass = 'badge-gray';
                if (t.status === 'open') statusClass = 'badge-warning';
                if (t.status === 'done') statusClass = 'badge-success';
                if (t.status === 'archive') statusClass = 'badge-info';
                
                const statusLabel = {open: 'Открыта', done: 'Выполнена', archive: 'Архив'}[t.status];
                
                return `
                <tr>
                    <td><strong>#${t.id}</strong></td>
                    <td>${t.client_id ? (window.clientsCache?.[t.client_id]?.name || 'ID:' + t.client_id) : '—'}</td>
                    <td>${t.type}</td>
                    <td>${t.contact || '—'}</td>
                    <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${t.description}">
                        ${t.description || '—'}
                    </td>
                    <td>${new Date(t.created_at).toLocaleDateString()}</td>
                    <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                    <td style="text-align: center;">
                        <button class="btn-action-icon" onclick="window.editTicket(${t.id})">✏️</button>
                        <button class="btn-action-icon delete" onclick="window.deleteTicketById(${t.id})">🗑️</button>
                    </td>
                </tr>`;
            }).join('');
        }
        function sendEmailToClient(email, subject, body) {
            const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            Neutralino.os.open(mailtoLink);
        }

        function setupEventDelegation() {
            document.getElementById('ticketList').addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const row = btn.closest('tr');
                const id = parseInt(row?.dataset?.ticketId);
                const action = btn.dataset.action;
                if (!id) return;

                try {
                    if (action === 'edit') editTicket(id);
                    else if (action === 'delete') await deleteTicketById(id);
                } catch (error) { alert('Ошибка: ' + error.message); }
            });
        }

        async function deleteTicketById(id) {
            if (!confirm('Удалить это обращение?')) return;
            await deleteTicket(id);
            if (window.saveDataToFile) await window.saveDataToFile();
            const tickets = await loadTickets();
            renderTicketTable(tickets);
        }

        async function editTicket(id) {
            const ticket = await loadTickets().then(t => t.find(x => x.id === id));
            if (!ticket) return;
            document.getElementById('editTicketId').value = id;
            document.getElementById('editClient').value = ticket.client_id || 'empty';
            document.getElementById('editType').value = ticket.type;
            document.getElementById('editContact').value = ticket.contact;
            document.getElementById('editDesc').value = ticket.description;
            document.getElementById('editStatus').value = ticket.status;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        async function saveEditTicket() {
            const id = parseInt(document.getElementById('editTicketId').value);
            const data = {
                client_id: document.getElementById('editClient').value,
                type: document.getElementById('editType').value,
                contact: document.getElementById('editContact').value,
                description: document.getElementById('editDesc').value,
                status: document.getElementById('editStatus').value
            };
            try {
                await updateTicket(id, data);
                if (window.saveDataToFile) await window.saveDataToFile();
                closeEditModal();
                renderTicketTable(await loadTickets());
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        document.addEventListener('DOMContentLoaded', () => {
                const showText = localStorage.getItem('crm_showNavText') !== 'false';
            if (!showText) {
                document.body.classList.add('nav-icons-only');
            }
            document.getElementById('btnCloseModal')?.addEventListener('click', closeEditModal);
            document.getElementById('btnSaveEdit')?.addEventListener('click', saveEditTicket);
            document.getElementById('editModal')?.addEventListener('click', e => e.target.id === 'editModal' && closeEditModal());
        });
    </script>
</body>
</html>
