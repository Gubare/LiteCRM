<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обращения - CRM</title>
        <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('crm_theme') || 'blue';
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch(e) {}
      })();

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Навигация -->
<nav class="main-nav">

            <polyline points="9 22 9 12 15 12 15 22"></polyline>

    </button>
    
    <button data-url="clients.html" class="nav-item">

            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>

    <button data-url="products.html" class="nav-item">

            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span class="nav-label">Товары</span>
    </button>
    
    <button data-url="tickets.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="nav-label">Обращения</span>
    </button>
    
    <button data-url="reports.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span class="nav-label">Отчёты</span>
    </button>
    
    <button data-url="sales.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span class="nav-label">Продажи</span>
    </button>
    
    <button data-url="settings.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

    <button data-url="calendar.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="nav-label">Календарь</span>
    </button>
    
    <button data-url="charts.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <!-- Иконка: линейный график -->
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span class="nav-label">Графики</span>
    </button>

    <button data-url="tasks.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>

    <main class="page-content">
        <h1>Управление обращениями
            <span class="tooltip-icon" style="font-size: 20px; margin-bottom: 15px;" data-tooltip="Раздел взаимодействия с обращениями.">?</span>
        </h1>
        
        <!-- Кнопка создания -->
        <div style="margin-bottom: 20px;">
            <button class="btn-primary" onclick="openModal('createTicketModal')" style="padding: 10px 20px; font-size: 15px;">
                Создать обращение
            </button>
        </div>
        
        <!-- Панель управления -->
        <div class="table-toolbar">
            <div class="toolbar-filters">
                <select id="filterType" class="form-control" style="width: 140px;">
                    <option value="">Все типы</option>
                    <option value="Вопрос">Вопрос</option>
                    <option value="Жалоба">Жалоба</option>
                    <option value="Заказ">Заказ</option>
                    <option value="Предложение">Предложение</option>
                </select>
                
                <select id="filterClient" class="form-control" style="width: 180px;">
                    <option value="">Все клиенты</option>
                </select>
                
                <select id="filterStatus" class="form-control" style="width: 140px;">
                    <option value="">Все статусы</option>
                    <option value="Открыта">Открыта</option>
                    <option value="Выполнена">Выполнена</option>
                    <option value="Архив">Архив</option>
                </select>
                
                <button id="btnApplyFilters" class="btn-primary" style="width: auto; padding: 8px 16px;">Применить</button>
                <button id="btnResetFilters" class="btn-action-icon" style="width: auto; padding: 8px 16px;">Сброс</button>
            </div>
            
            <div class="toolbar-pagination">
                <label style="font-size: 13px; color: #64748b;">Записей:</label>
                <select id="pageSize" class="form-control" style="width: 70px;">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                
                <label style="font-size: 13px; color: #64748b; margin: 0 8px;">Сортировка:</label>
                <select id="sortSelect" class="form-control" style="width: 140px;">
                    <option value="date_desc">Сначала новые</option>
                    <option value="date_asc">Сначала старые</option>
                </select>
            </div>
        </div>
        
        <!-- Панель массовых действий -->
        <div id="bulkActionBar" class="bulk-action-bar">
            <span>Выбрано записей: <span class="count-badge" id="selectedCount">0</span></span>
            <button id="btnBulkEdit" class="btn-action-icon" disabled onclick="editSelected()">Изменить</button>
            <button id="btnBulkDelete" class="btn-action-icon delete" onclick="deleteSelected()">Удалить</button>
            <button class="btn-action-icon" onclick="clearSelection()" style="margin-left:auto; font-size:12px; color:#64748b;">✕ Снять выделение</button>
        </div>
        
        <!-- Таблица -->
        <table id="ticketTable" class="crm-table">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Клиент</th>
                    <th style="width: 100px;">Тип
                        <span class="tooltip-icon" data-tooltip="Тип обращения">?</span>
                    </th>
                    <th>Контакт
                        <span class="tooltip-icon" data-tooltip="Заявленный контакт для ответа">?</span>
                    </th>
                    <th>Описание</th>
                    <th style="width: 100px;">Дата
                        <span class="tooltip-icon" data-tooltip="Дата создания обращения">?</span>
                    </th>
                    <th style="width: 100px;">Статус</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
            <!-- Пагинация -->
            <div class="pagination-container">
                <div id="pagination" class="pagination"></div>
                <span id="paginationInfo"></span>
            </div>
    </main>

    <!-- Модальное окно: Создание обращения -->
    <div id="createTicketModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'createTicketModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-hint">Нажмите в любое место за пределами окна, чтобы закрыть</div>
            <div class="modal-header">
                <h3 style="margin: 0;">Новое обращение</h3>
            </div>
            <form id="createTicketForm">
                <div class="form-row">
                    <div>
                        <label>Клиент:</label>
                        <select id="ticketClient" class="form-control" style="width: 100%;">
                            <option value="">Оставить пустым</option>
                        </select>
                    </div>
                    <div>
                        <label>Тип обращения:</label>
                        <select id="ticketType" class="form-control" style="width: 100%;" required>
                            <option value="Вопрос">Вопрос</option>
                            <option value="Жалоба">Жалоба</option>
                            <option value="Заказ">Заказ</option>
                            <option value="Предложение">Предложение</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Контакт для ответа:</label>
                        <input type="text" id="ticketContact" class="form-control" style="width: 100%;" placeholder="Телефон / Email / Telegram">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="ticketStatus" class="form-control" style="width: 100%;">
                            <option value="Открыта">Открыта</option>
                            <option value="Выполнена">Выполнена</option>
                            <option value="Архив">Архив</option>
                        </select>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Подробное описание:</label>
                        <textarea id="ticketDescription" rows="4" placeholder="Суть вопроса или задачи..."></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('createTicketModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Создать обращение</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Редактирование -->
    <div id="editTicketModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'editTicketModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">Редактирование обращения</h3>
            </div>
            <form id="editTicketForm">
                <input type="hidden" id="editTicketId">
                <div class="form-row">
                    <div>
                        <label>Клиент:</label>
                        <select id="editTicketClient" class="form-control" style="width: 100%;">
                            <option value="">Оставить пустым</option>
                        </select>
                    </div>
                    <div>
                        <label>Тип обращения:</label>
                        <select id="editTicketType" class="form-control" style="width: 100%;">
                            <option value="Вопрос">Вопрос</option>
                            <option value="Жалоба">Жалоба</option>
                            <option value="Заказ">Заказ</option>
                            <option value="Предложение">Предложение</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Контакт для ответа:</label>
                        <input type="text" id="editTicketContact" class="form-control" style="width: 100%;">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="editTicketStatus" class="form-control" style="width: 100%;">
                            <option value="Открыта">Открыта</option>
                            <option value="Выполнена">Выполнена</option>
                            <option value="Архив">Архив</option>
                        </select>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Подробное описание:</label>
                        <textarea id="editTicketDescription" rows="4"></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('editTicketModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Модальное окно просмотра полного текста -->
    <div id="fullTextModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'fullTextModal')">
        <div class="modal-window" style="max-width: 500px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">Полный текст</h3>
            </div>
            <div style="padding: 20px 0; color: #334155; line-height: 1.6; font-size: 15px; max-height: 60vh; overflow-y: auto;">
                <p id="fullTextContent" style="white-space: pre-wrap;"></p>
            </div>
            <button class="btn-primary" onclick="closeModal('fullTextModal')" style="width: 100%;">Понятно</button>
        </div>
    </div>

    <!-- Контекстное меню -->
    <div id="ctxMenu" class="ctx-menu">
        <button class="ctx-menu-item" id="ctxEdit" onclick="ctxEditAction()">
            <span></span> Редактировать
        </button>
        <div class="ctx-divider"></div>
        <button class="ctx-menu-item danger" id="ctxDelete" onclick="ctxDeleteAction()">
            <span></span> Удалить
        </button>
    </div>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/tickets.js"></script>
</body>
</html>
