<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обращения - CRM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="main-nav">
    <a href="index.html"><span class="nav-icon">🏠</span> <span class="nav-text">Главная</span></a>
    <a href="clients.html"><span class="nav-icon">👥</span> <span class="nav-text">Клиенты</span></a>
    <a href="products.html"><span class="nav-icon">📦</span> <span class="nav-text">Товары</span></a>
    <a href="tickets.html"><span class="nav-icon">🎫</span> <span class="nav-text">Обращения</span></a>
    <a href="reports.html"><span class="nav-icon">📈</span> <span class="nav-text">Отчёты</span></a>
    <a href="sales.html"><span class="nav-icon">💰</span> <span class="nav-text">Продажи</span></a>
    <a href="settings.html"><span class="nav-icon">⚙️</span> <span class="nav-text">Настройки</span></a>
    <a href="calendar.html"><span class="nav-icon">📅</span> <span class="nav-text">Календарь</span></a>
    </nav>

    <main class="page-content">
        <h1>Управление обращениями</h1>
        
        <!-- Кнопка создания -->
        <div style="margin-bottom: 20px;">
            <button class="btn-primary" onclick="openModal('createTicketModal')" style="padding: 10px 20px; font-size: 15px;">
                🎫 Создать обращение
            </button>
        </div>
        
        <!-- Панель управления -->
        <div class="table-toolbar">
            <div class="toolbar-filters">
                <select id="filterType" class="form-control" style="width: 140px;">
                    <option value="">Все типы</option>
                    <option value="Вопрос">Вопрос</option>
                    <option value="Жалоба">Жалоба</option>
                    <option value="Заказ">Заказ</option>
                    <option value="Предложение">Предложение</option>
                </select>
                
                <select id="filterClient" class="form-control" style="width: 180px;">
                    <option value="">Все клиенты</option>
                </select>
                
                <select id="filterStatus" class="form-control" style="width: 140px;">
                    <option value="">Все статусы</option>
                    <option value="Открыта">Открыта</option>
                    <option value="Выполнена">Выполнена</option>
                    <option value="Архив">Архив</option>
                </select>
                
                <button id="btnApplyFilters" class="btn-primary" style="width: auto; padding: 8px 16px;">Применить</button>
                <button id="btnResetFilters" class="btn-action-icon" style="width: auto; padding: 8px 16px;">Сброс</button>
            </div>
            
            <div class="toolbar-pagination">
                <label style="font-size: 13px; color: #64748b;">Записей:</label>
                <select id="pageSize" class="form-control" style="width: 70px;">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                
                <label style="font-size: 13px; color: #64748b; margin: 0 8px;">Сортировка:</label>
                <select id="sortSelect" class="form-control" style="width: 140px;">
                    <option value="date_desc">Сначала новые</option>
                    <option value="date_asc">Сначала старые</option>
                </select>
            </div>
        </div>
        
        <!-- Панель массовых действий -->
        <div id="bulkActionBar" class="bulk-action-bar">
            <span>Выбрано записей: <span class="count-badge" id="selectedCount">0</span></span>
            <button id="btnBulkEdit" class="btn-action-icon" disabled onclick="editSelected()">✏️ Изменить</button>
            <button id="btnBulkDelete" class="btn-action-icon delete" onclick="deleteSelected()">🗑️ Удалить</button>
            <button class="btn-action-icon" onclick="clearSelection()" style="margin-left:auto; font-size:12px; color:#64748b;">✕ Снять выделение</button>
        </div>
        
        <!-- Таблица -->
        <table id="ticketTable" class="crm-table">
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Клиент</th>
                    <th style="width: 100px;">Тип</th>
                    <th>Контакт</th>
                    <th>Описание</th>
                    <th style="width: 100px;">Дата</th>
                    <th style="width: 100px;">Статус</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
            <!-- Пагинация -->
            <div class="pagination-container">
                <div id="pagination" class="pagination"></div>
                <span id="paginationInfo"></span>
            </div>
    </main>

    <!-- Модальное окно: Создание обращения -->
    <div id="createTicketModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'createTicketModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-hint">💡 Нажмите в любое место за пределами окна, чтобы закрыть</div>
            <div class="modal-header">
                <h3 style="margin: 0;">🎫 Новое обращение</h3>
            </div>
            <form id="createTicketForm">
                <div class="form-row">
                    <div>
                        <label>Клиент:</label>
                        <select id="ticketClient" class="form-control" style="width: 100%;">
                            <option value="">Оставить пустым</option>
                        </select>
                    </div>
                    <div>
                        <label>Тип обращения:</label>
                        <select id="ticketType" class="form-control" style="width: 100%;" required>
                            <option value="Вопрос">Вопрос</option>
                            <option value="Жалоба">Жалоба</option>
                            <option value="Заказ">Заказ</option>
                            <option value="Предложение">Предложение</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Контакт для ответа:</label>
                        <input type="text" id="ticketContact" class="form-control" style="width: 100%;" placeholder="Телефон / Email / Telegram">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="ticketStatus" class="form-control" style="width: 100%;">
                            <option value="Открыта">Открыта</option>
                            <option value="Выполнена">Выполнена</option>
                            <option value="Архив">Архив</option>
                        </select>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Подробное описание:</label>
                        <textarea id="ticketDescription" rows="4" placeholder="Суть вопроса или задачи..."></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('createTicketModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Создать обращение</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Редактирование -->
    <div id="editTicketModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'editTicketModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">✏️ Редактирование обращения</h3>
            </div>
            <form id="editTicketForm">
                <input type="hidden" id="editTicketId">
                <div class="form-row">
                    <div>
                        <label>Клиент:</label>
                        <select id="editTicketClient" class="form-control" style="width: 100%;">
                            <option value="">Оставить пустым</option>
                        </select>
                    </div>
                    <div>
                        <label>Тип обращения:</label>
                        <select id="editTicketType" class="form-control" style="width: 100%;">
                            <option value="Вопрос">Вопрос</option>
                            <option value="Жалоба">Жалоба</option>
                            <option value="Заказ">Заказ</option>
                            <option value="Предложение">Предложение</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Контакт для ответа:</label>
                        <input type="text" id="editTicketContact" class="form-control" style="width: 100%;">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="editTicketStatus" class="form-control" style="width: 100%;">
                            <option value="Открыта">Открыта</option>
                            <option value="Выполнена">Выполнена</option>
                            <option value="Архив">Архив</option>
                        </select>
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Подробное описание:</label>
                        <textarea id="editTicketDescription" rows="4"></textarea>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('editTicketModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Модальное окно просмотра полного текста -->
    <div id="fullTextModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'fullTextModal')">
        <div class="modal-window" style="max-width: 500px;" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">Полный текст</h3>
            </div>
            <div style="padding: 20px 0; color: #334155; line-height: 1.6; font-size: 15px; max-height: 60vh; overflow-y: auto;">
                <p id="fullTextContent" style="white-space: pre-wrap;"></p>
            </div>
            <button class="btn-primary" onclick="closeModal('fullTextModal')" style="width: 100%;">Понятно</button>
        </div>
    </div>

    <!-- Контекстное меню -->
    <div id="ctxMenu" class="ctx-menu">
        <button class="ctx-menu-item" id="ctxEdit" onclick="ctxEditAction()">
            <span>✏️</span> Редактировать
        </button>
        <div class="ctx-divider"></div>
        <button class="ctx-menu-item danger" id="ctxDelete" onclick="ctxDeleteAction()">
            <span>🗑️</span> Удалить
        </button>
    </div>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/tickets.js"></script>
</body>
</html>
