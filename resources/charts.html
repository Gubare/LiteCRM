<body>

    <button data-url="clients.html" class="nav-item">

            <polyline points="14 2 14 8 20 8"></polyline>

            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="nav-label">Обращения</span>
    </button>
    
    <button data-url="reports.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>

    </button>

    <button data-url="calendar.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <line x1="8" y1="2" x2="8" y2="6"></line>

    <button data-url="charts.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <main class="page-content">
        <h1 class="page-title">📊 Аналитика и графики</h1>
        
        <!-- Панель управления периодами -->
        <div class="charts-period-panel">
            <div class="period-presets">
                <label>Период:</label>
                <select id="chartPeriod" class="form-control">
                    <option value="7">7 дней</option>
                    <option value="30">30 дней</option>
                    <option value="90">3 месяца</option>
                    <option value="365">Год</option>
                    <option value="all">Всё время</option>
                    <option value="custom">📅 Произвольный</option>
                </select>
            </div>
            
            <!-- Произвольный период (скрыт по умолчанию) -->
            <div id="customPeriodSection" class="custom-period-section" style="display: none;">
                <div class="date-input-group">
                    <label>С:</label>
                    <input type="date" id="customDateFrom" class="form-control">
                </div>
                <div class="date-input-group">
                    <label>По:</label>
                    <input type="date" id="customDateTo" class="form-control">
                </div>
                <button id="btnApplyCustomPeriod" class="btn btn-primary">Применить</button>
                <button id="btnResetPeriod" class="btn btn-secondary">Сбросить</button>
            </div>
            
            <div class="period-info" id="periodInfo"></div>
        </div>
        
        <!-- Режимы данных (аналог календаря) -->
        <div class="chart-data-modes">
            <button class="mode-btn active" data-mode="sales">💰 Продажи</button>
            <button class="mode-btn" data-mode="clients">👥 Клиенты</button>
            <button class="mode-btn" data-mode="products">📦 Товары</button>
            <button class="mode-btn" data-mode="tickets">🎫 Обращения</button>
            <button class="mode-btn" data-mode="activity">📊 Сводная</button>
        </div>
        
        <!-- Сетка графиков -->
        <div class="charts-grid" id="chartsContainer">
            <!-- Графики генерируются динамически -->
        </div>
    </main>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/charts.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
