<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Клиенты - CRM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Стили для кнопок действий */
        .btn-action {
            padding: 4px 8px;
            margin: 0 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete {
            background: #fef2f2;
            border-color: #ef4444;
            color: #ef4444;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: white;
        }
        .btn-edit {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .btn-edit:hover {
            background: #3b82f6;
            color: white;
        }
        
    </style>
</head>
<body>
<nav class="main-nav">
    <a href="index.html"><span class="nav-icon">🏠</span> <span class="nav-text">Главная</span></a>
    <a href="clients.html"><span class="nav-icon">👥</span> <span class="nav-text">Клиенты</span></a>
    <a href="products.html"><span class="nav-icon">📦</span> <span class="nav-text">Товары</span></a>
    <a href="tickets.html"><span class="nav-icon">🎫</span> <span class="nav-text">Обращения</span></a>
    <a href="reports.html"><span class="nav-icon">📈</span> <span class="nav-text">Отчёты</span></a>
    <a href="sales.html"><span class="nav-icon">💰</span> <span class="nav-text">Продажи</span></a>
    <a href="settings.html"><span class="nav-icon">⚙️</span> <span class="nav-text">Настройки</span></a>
</nav>

    <main class="page-content">
    <h1>Список клиентов</h1>
    
    <h2>Добавить клиента</h2>
    <!-- Форма добавления -->
    <form id="clientForm">
        <input type="text" id="clientName" name="name" placeholder="Имя" required>
        <input type="text" id="clientPhone" name="phone" placeholder="Телефон">
        <input type="email" id="clientEmail" name="email" placeholder="Email">
        <button type="submit" id="btnAddClient" class="btn-action btn-edit">Добавить</button>
    </form>
    <div id="message"></div>
    
    <h2>Все клиенты</h2>
<table id="clientList">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Email</th>
            <th>Покупки</th>
            <th>Общая сумма</th>
            <th>Ср. чек</th>
            <th>Сегмент</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>


<!-- Модальное окно для редактирования -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="background: white; margin: 100px auto; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
        <h3>Редактировать клиента</h3>
        <input type="hidden" id="editClientId">
        <div style="margin-bottom: 10px;">
            <label>Имя:</label>
            <input type="text" id="editName" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Телефон:</label>
            <input type="text" id="editPhone" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Email:</label>
            <input type="email" id="editEmail" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="text-align: right;">
            <button id="btnCloseModal" class="btn-action">Отмена</button>
            <!-- Оставил btnSaveEdit для модального окна -->
            <button id="btnSaveEdit" class="btn-action btn-edit">Сохранить</button>
        </div>
    </div>
</div>
</main>
    <!-- Подключаем скрипты -->
    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/client.js"></script>
        <script type="module" src="js/analytics.js"></script>
    <!-- main.js подключаем, но рендеринг будет в этом файле -->
    <script type="module" src="js/main.js"></script>
    
    <!-- Логика страницы клиентов -->
    <script type="module">
        import { loadClientList, handleClientFormSubmit, deleteClient, updateClient } from './js/client.js';
        import { calculateClientDisplayData } from './js/client.js';
        // Инициализация Neutralino
        if (typeof Neutralino !== 'undefined') {
            Neutralino.init();
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Ждём готовности БД
            if (window.isDatabaseReady) {
                const clients = await loadClientList();
                renderClientTable(clients);
            } else {
                document.addEventListener('dbReady', async () => {
                    const clients = await loadClientList();
                    renderClientTable(clients);
                }, { once: true });
            }
        });
        
        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('clientName').value,
                phone: document.getElementById('clientPhone').value,
                email: document.getElementById('clientEmail').value
            };
            
            try {
                await handleClientFormSubmit(formData);
                
                if (typeof window.saveDataToFile === 'function') {
                    await window.saveDataToFile();
                    console.log('💾 Бэкап сохранён после добавления клиента');
                }
                
                // Очищаем форму
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                document.getElementById('clientEmail').value = '';
                
                // Перезагружаем список
                const clients = await loadClientList();
                renderClientTable(clients);
                
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + error.message);
            }
        }, { once: false }); // Можно установить true или оставить false

        // Рендер таблицы с кнопками
        function renderClientTable(clients) {
            const tbody = document.querySelector('#clientList tbody');
            if (!tbody) return;
            
            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 60px; color: #94a3b8; font-size: 14px;">📭 Нет клиентов. Добавьте первого!</td></tr>';
                return;
            }
            
            const showTooltips = localStorage.getItem('crm_showCategoryTooltips') !== 'false';
            const fmt = (num) => num.toLocaleString('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 });
            
            tbody.innerHTML = clients.map(client => {
                const metrics = calculateClientDisplayData(client);
                
                const segmentHtml = showTooltips 
                    ? `<span title="${metrics.segmentTooltip}" style="cursor: help;">
                        ${metrics.segment}
                    </span>`
                    : metrics.segment;
                
                const newBadgeHtml = metrics.newBadge 
                    ? `<span title="${metrics.newBadge.tooltip}" 
                            style="background: ${metrics.newBadge.color}; color: white; 
                                padding: 4px 8px; border-radius: 12px; 
                                font-size: 11px; font-weight: 500;
                                cursor: help; display: inline-flex; align-items: center; gap: 4px;">
                            ${metrics.newBadge.icon} Новый
                    </span>`
                    : '';
                
                // Обрезаем длинные email и телефоны
                const truncate = (text, maxLen = 20) => {
                    if (!text || text === '—') return '—';
                    return text.length > maxLen ? text.substring(0, maxLen) + '...' : text;
                };
                
                return `
                <tr>
                    <td style="font-weight: 500; color: #64748b;">${client.id}</td>
                    <td><strong style="color: #0f172a;">${client.name || '—'}</strong></td>
                    <td style="font-family: monospace; color: #475569;">${truncate(client.phone, 15)}</td>
                    <td style="color: #475569;">${truncate(client.email, 25)}</td>
                    <td style="text-align: center; font-weight: 500;">${metrics.count}</td>
                    <td style="text-align: right; font-weight: 600; color: #0f172a;">${fmt(metrics.total)}</td>
                    <td style="text-align: right; font-weight: 600; color: #3b82f6;">${fmt(metrics.avgCheck)}</td>
                    <td>
                        <span style="
                            background: ${metrics.segmentColor};
                            color: white;
                            padding: 4px 10px;
                            border-radius: 12px;
                            font-size: 11px;
                            font-weight: 500;
                            display: inline-block;
                            white-space: nowrap;
                        ">
                            ${segmentHtml}
                        </span>
                        ${newBadgeHtml ? `<span style="margin-left: 4px;">${newBadgeHtml}</span>` : ''}
                    </td>
                    <td>
                        <button class="btn-action btn-edit" onclick="window.editClient(${client.id}, '${client.name}', '${client.phone}', '${client.email}')" 
                                style="padding: 6px 10px; font-size: 13px;" title="Редактировать">✏️</button>
                        <button class="btn-action btn-delete" onclick="window.deleteClientById(${client.id})" 
                                style="padding: 6px 10px; font-size: 13px;" title="Удалить">🗑️</button>
                    </td>
                </tr>
                `;
            }).join('');
        }
        // Удаление клиента
        window.deleteClientById = async function(id) {
            if (!confirm('Вы уверены, что хотите удалить этого клиента?')) return;
            
            try {
                await deleteClient(id);
                
                // Сохраняем бэкап после удаления
                if (typeof window.saveDataToFile === 'function') {
                    await window.saveDataToFile();
                }
                
                const clients = await loadClientList();
                renderClientTable(clients);
                
            } catch (error) {
                alert('Не удалось удалить: ' + error.message);
            }
        };
        
            // Редактирование клиента
            window.editClient = function(id, name, phone, email) {
                document.getElementById('editClientId').value = id;
                document.getElementById('editName').value = name;
                document.getElementById('editPhone').value = phone;
                document.getElementById('editEmail').value = email;
                document.getElementById('editModal').style.display = 'block';
            };
            
            // Закрытие модального окна
            function closeEditModal() {
                document.getElementById('editModal').style.display = 'none';
            }
        
    //Cохранение редактирования клиента
    // Сохранение изменений
    async function saveEditClient() {
        const id = parseInt(document.getElementById('editClientId').value);
        const updatedData = {
            name: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
            email: document.getElementById('editEmail').value
        };
        
        try {
            if (window.updateClient) {
                await window.updateClient(id, updatedData);
                console.log('✅ Клиент обновлён');
                
                // Сохраняем бэкап
                if (window.saveDataToFile) {
                    await window.saveDataToFile();
                }
                
                closeEditModal();
                
                // Перезагружаем список
                const clients = await loadClientList();
                renderClientTable(clients);
            } else {
                alert('Функция updateClient ещё не реализована');
            }
        } catch (error) {
            alert('Ошибка обновления: ' + error.message);
        }
    }
        // Добавляем обработчики событий после загрузки DOM
        document.addEventListener('DOMContentLoaded', async () => {
                const showText = localStorage.getItem('crm_showNavText') !== 'false';
                if (!showText) {
                    document.body.classList.add('nav-icons-only');
                }
            const loadingOverlay = document.getElementById('tableLoading');
    
            try {
                // Ждём БД
                if (!window.isDatabaseReady) {
                    await new Promise(resolve => {
                        document.addEventListener('dbReady', resolve, { once: true });
                    });
                }
                
                const clients = await loadClientList();
                renderClientTable(clients);
                
                // Скрываем заглушку
                if (loadingOverlay) {
                    loadingOverlay.classList.add('hidden');
                    setTimeout(() => loadingOverlay.remove(), 300);
                }
                
            } catch (error) {
                console.error('Error:', error);
                if (loadingOverlay) {
                    loadingOverlay.innerHTML = '<p style="color: #ef4444;">❌ Ошибка загрузки</p>';
                }
            }
        document.getElementById('btnCloseModal').addEventListener('click', closeEditModal);
        document.getElementById('btnSaveEdit').addEventListener('click', saveEditClient);
        
        // Закрытие по клику вне модального окна
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });
    });

            // Делаем функции глобальными
            window.updateClient = updateClient;
            window.deleteClientById = deleteClientById;
            window.editClient = editClient;
            window.renderClientTable = renderClientTable;
    </script>
</body>
</html>
