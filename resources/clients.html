<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты - CRM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* === ФИКСИРОВАННАЯ ТАБЛИЦА КЛИЕНТОВ === */
        .crm-table { table-layout: fixed; width: 100%; border-collapse: collapse; }
    
    </style>
</head>
<body>
        <!-- Навигация -->
    <nav class="main-nav">
    <a href="index.html"><span class="nav-icon">🏠</span> <span class="nav-text">Главная</span></a>
    <a href="clients.html"><span class="nav-icon">👥</span> <span class="nav-text">Клиенты</span></a>
    <a href="products.html"><span class="nav-icon">📦</span> <span class="nav-text">Товары</span></a>
    <a href="tickets.html"><span class="nav-icon">🎫</span> <span class="nav-text">Обращения</span></a>
    <a href="reports.html"><span class="nav-icon">📈</span> <span class="nav-text">Отчёты</span></a>
    <a href="sales.html"><span class="nav-icon">💰</span> <span class="nav-text">Продажи</span></a>
    <a href="settings.html"><span class="nav-icon">⚙️</span> <span class="nav-text">Настройки</span></a>
    <a href="calendar.html"><span class="nav-icon">📅</span> <span class="nav-text">Календарь</span></a>
    <a href="charts.html"><span class="nav-icon">📊</span> <span class="nav-text">Графики</span></a>
    </nav>  

    <main class="page-content">
        <h1>Список клиентов</h1>
        
        <!-- Панель управления -->
        <div class="table-toolbar">
            <div class="toolbar-filters">
                <input type="text" id="filterSearch" class="form-control" placeholder="Поиск по имени/телефону..." style="width: 250px;">
                <select id="filterCluster" class="form-control" style="width: 160px;">
                    <option value="">Все сегменты</option>
                    <option value="new">Новые</option>
                    <option value="regular">Обычные</option>
                    <option value="vip">VIP</option>
                </select>
                <button id="btnApplyFilters" class="btn-primary">Применить</button>
                <button id="btnResetFilters" class="btn-action">Сброс</button>
            </div>
            <div class="toolbar-actions">
                <button class="btn-primary" onclick="openClientModal()">Добавить клиента</button>
            </div>
        </div>

        <!-- Панель массовых действий -->
        <div id="bulkActionBar" class="bulk-action-bar">
            <span>Выбрано: <span class="count-badge">0</span></span>
            <button id="btnBulkDelete" class="btn-action delete" onclick="window.bulkDelete()">🗑️ Удалить</button>
            <button class="btn-action" onclick="window.selectionManager.clear()" style="margin-left:auto;">✕ Снять выделение</button>
        </div>

        <!-- Таблица -->
        <table id="clientTable" class="crm-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Покупки</th>
                    <th>Сумма</th>
                    <th>Ср. чек</th>
                    <th>Сегмент</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Пагинация -->  
        <div class="pagination-container">
            <div id="pagination" class="pagination"></div>
            <span id="paginationInfo"></span>
        </div>
    </main>

    <!-- Контекстное меню -->
    <div id="ctxMenu" class="ctx-menu">
        <button class="ctx-menu-item" onclick="window.editFromCtx()">✏️ Редактировать</button>
        <button class="ctx-menu-item danger" onclick="window.deleteFromCtx()">🗑️ Удалить</button>
    </div>

    <!-- Модальное окно Клиента (Создание/Редактирование) -->
    <div id="clientModal" class="modal-overlay" onclick="closeModal('clientModal')">
        <div class="modal-window" onclick="event.stopPropagation()" style="max-width: 500px;">
            <h3 id="clientModalTitle">Добавить клиента</h3>
            <form id="clientForm">
                <input type="hidden" id="clientId">
                <div class="form-group">
                    <label>Имя *</label>
                    <input type="text" id="clientName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="clientPhone" class="form-control" placeholder="+7...">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="clientEmail" class="form-control" placeholder="mail@example.com">
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px;">
                    <button type="button" class="btn-action" onclick="closeModal('clientModal')" style="flex:1;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex:1;">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно Кластера (Инфо) -->
    <div id="clusterInfoModal" class="modal-overlay" onclick="closeModal('clusterInfoModal')">
        <div class="modal-window" onclick="event.stopPropagation()" style="max-width: 400px;">
            <h3>Параметры сегмента</h3>
            <div id="clusterStats" style="margin: 20px 0; color: #475569; line-height: 1.8;"></div>
            <button class="btn-primary" onclick="closeModal('clusterInfoModal')" style="width: 100%;">Понятно</button>
        </div>
    </div>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/client.js"></script>
</body>
</html>
