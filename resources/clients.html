<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Клиенты - CRM</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Стили для кнопок действий */
        .btn-action {
            padding: 4px 8px;
            margin: 0 2px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-delete {
            background: #fef2f2;
            border-color: #ef4444;
            color: #ef4444;
        }
        .btn-delete:hover {
            background: #ef4444;
            color: white;
        }
        .btn-edit {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .btn-edit:hover {
            background: #3b82f6;
            color: white;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Главная</a>
        <a href="clients.html">Клиенты</a>
        <a href="report.html">Продажи</a>
    </nav>
    
    <h1>Список клиентов</h1>
    
    <h2>Добавить клиента</h2>
    <!-- Форма добавления -->
    <form id="clientForm">
        <input type="text" id="clientName" name="name" placeholder="Имя" required>
        <input type="text" id="clientPhone" name="phone" placeholder="Телефон">
        <input type="email" id="clientEmail" name="email" placeholder="Email">
        <button type="submit" id="btnAddClient" class="btn-action btn-edit">Добавить</button>
    </form>
    <div id="message"></div>
    
    <h2>Все клиенты</h2>
    <table id="clientList">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

<!-- Модальное окно для редактирования -->
<div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="background: white; margin: 100px auto; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
        <h3>Редактировать клиента</h3>
        <input type="hidden" id="editClientId">
        <div style="margin-bottom: 10px;">
            <label>Имя:</label>
            <input type="text" id="editName" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Телефон:</label>
            <input type="text" id="editPhone" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="margin-bottom: 10px;">
            <label>Email:</label>
            <input type="email" id="editEmail" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="text-align: right;">
            <button id="btnCloseModal" class="btn-action">Отмена</button>
            <!-- Оставил btnSaveEdit для модального окна -->
            <button id="btnSaveEdit" class="btn-action btn-edit">Сохранить</button>
        </div>
    </div>
</div>

    <!-- Подключаем скрипты -->
    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/client.js"></script>
    <!-- main.js подключаем, но рендеринг будет в этом файле -->
    <script type="module" src="js/main.js"></script>
    
    <!-- Логика страницы клиентов -->
    <script type="module">
        import { loadClientList, handleClientFormSubmit, deleteClient, updateClient } from './js/client.js';
        
        // Инициализация Neutralino
        if (typeof Neutralino !== 'undefined') {
            Neutralino.init();
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Ждём инициализации БД из main.js
            setTimeout(async () => {
                try {
                    const clients = await loadClientList();
                    renderClientTable(clients);
                } catch (error) {
                    console.error('Error loading clients:', error);
                }
            }, 100);
        });
        
        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('clientName').value,
                phone: document.getElementById('clientPhone').value,
                email: document.getElementById('clientEmail').value
            };
            
            try {
                await handleClientFormSubmit(formData);
                
                if (typeof window.saveDataToFile === 'function') {
                    await window.saveDataToFile();
                    console.log('💾 Бэкап сохранён после добавления клиента');
                }
                
                // Очищаем форму
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                document.getElementById('clientEmail').value = '';
                
                // Перезагружаем список
                const clients = await loadClientList();
                renderClientTable(clients);
                
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка: ' + error.message);
            }
        }, { once: false }); // Уберите или оставьте false
        // Рендер таблицы с кнопками
        function renderClientTable(clients) {
            const tbody = document.querySelector('#clientList tbody');
            if (!tbody) return;
            
            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">Нет клиентов</td></tr>';
                return;
            }
            
            tbody.innerHTML = clients.map(client => `
                <tr>
                    <td>${client.id}</td>
                    <td>${client.name || ''}</td>
                    <td>${client.phone || ''}</td>
                    <td>${client.email || ''}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="window.editClient(${client.id}, '${client.name}', '${client.phone}', '${client.email}')">
                            ✏️ Изм.
                        </button>
                        <button class="btn-action btn-delete" onclick="window.deleteClientById(${client.id})">
                            🗑️ Удалить
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
                // Удаление клиента
        window.deleteClientById = async function(id) {
            if (!confirm('Вы уверены, что хотите удалить этого клиента?')) return;
            
            try {
                await deleteClient(id);
                
                // Сохраняем бэкап после удаления
                if (typeof window.saveDataToFile === 'function') {
                    await window.saveDataToFile();
                }
                
                const clients = await loadClientList();
                renderClientTable(clients);
                
            } catch (error) {
                alert('Не удалось удалить: ' + error.message);
            }
        };
        
            // Редактирование клиента
            window.editClient = function(id, name, phone, email) {
                document.getElementById('editClientId').value = id;
                document.getElementById('editName').value = name;
                document.getElementById('editPhone').value = phone;
                document.getElementById('editEmail').value = email;
                document.getElementById('editModal').style.display = 'block';
            };
            
            // Закрытие модального окна (теперь без window.)
            function closeEditModal() {
                document.getElementById('editModal').style.display = 'none';
            }
        
            //Cохранение редактирования клиента
    // Сохранение изменений (теперь без window.)
    async function saveEditClient() {
        const id = parseInt(document.getElementById('editClientId').value);
        const updatedData = {
            name: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
            email: document.getElementById('editEmail').value
        };
        
        try {
            if (window.updateClient) {
                await window.updateClient(id, updatedData);
                console.log('✅ Клиент обновлён');
                
                // Сохраняем бэкап
                if (window.saveDataToFile) {
                    await window.saveDataToFile();
                }
                
                closeEditModal();
                
                // Перезагружаем список
                const clients = await loadClientList();
                renderClientTable(clients);
            } else {
                alert('Функция updateClient ещё не реализована');
            }
        } catch (error) {
            alert('Ошибка обновления: ' + error.message);
        }
    }
            // !!! Добавляем обработчики событий после загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnCloseModal').addEventListener('click', closeEditModal);
        document.getElementById('btnSaveEdit').addEventListener('click', saveEditClient);
        
        // Закрытие по клику вне модального окна
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') {
                closeEditModal();
            }
        });
    });

        // Делаем функции глобальными
            window.updateClient = updateClient;
            window.deleteClientById = deleteClientById;
            window.editClient = editClient;
            window.renderClientTable = renderClientTable;
    </script>
</body>
</html>
