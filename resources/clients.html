<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Клиенты - CRM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">Главная</a>
        <a href="clients.html">Клиенты</a>
        <a href="report.html">Продажи</a>
    </nav>
    
    <h1>Список клиентов</h1>
    
    <h2>Добавить клиента</h2>
    <form id="clientForm">
        <input type="text" name="name" placeholder="Имя" required>
        <input type="text" name="phone" placeholder="Телефон">
        <input type="email" name="email" placeholder="Email">
        <button type="submit">Добавить</button>
    </form>
    <div id="message"></div>
    
    <h2>Все клиенты</h2>
    <table id="clientList">
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Телефон</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <!-- Заполняется через JS -->
        </tbody>
    </table>
    
    <!-- Подключаем скрипты без import/export -->
    <script src="js/db_indexeddb.js"></script>
    <script src="js/client.js"></script>
    <script>
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            // Инициализируем базу данных
            const database = await initDatabase();
            
            // Передаём экземпляр БД в client.js
            setDbInstance(database);
            
            // Настраиваем обработчик формы
            var form = document.getElementById('clientForm');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    var formData = new FormData(e.target);
                    await handleClientFormSubmit({
                        name: formData.get('name'),
                        phone: formData.get('phone'),
                        email: formData.get('email')
                    });
                });
            }
            
            // Загружаем список клиентов
            if (document.getElementById('clientList')) {
                var clients = await loadClientList();
                renderClientTable(clients);
            }
        });
        
        // Функция отрисовки таблицы
        function renderClientTable(clients) {
            var tbody = document.querySelector('#clientList tbody');
            if (!tbody) return;
            
            var html = '';
            for (var i = 0; i < clients.length; i++) {
                var client = clients[i];
                html += '<tr>' +
                    '<td>' + client.id + '</td>' +
                    '<td>' + client.name + '</td>' +
                    '<td>' + (client.phone || '') + '</td>' +
                    '<td>' + (client.email || '') + '</td>' +
                    '</tr>';
            }
            tbody.innerHTML = html;
        }
        
        // Делаем функцию доступной глобально
        window.renderClientTable = renderClientTable;
    </script>
</body>
</html>
