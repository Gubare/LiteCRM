<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Товары - CRM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <a href="index.html">🏠 Главная</a>
        <a href="clients.html">👥 Клиенты</a>
        <a href="products.html">📦 Товары</a>
        <a href="sales.html">💰 Продажи</a>
    </nav>
    
    <h1>Управление товарами</h1>
    
    <!-- Форма добавления товара -->
    <form id="productForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="productCategory" name="category" placeholder="Категория *" required>
            <input type="text" id="productName" name="name" placeholder="Название *" required>
        </div>
        <textarea id="productDescription" name="description" placeholder="Описание" style="width: 100%; margin-bottom: 10px;"></textarea>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="productPrice" name="price" placeholder="Цена *" step="0.01" min="0" required>
            <input type="number" id="productQuantity" name="quantity" placeholder="Количество *" min="0" required>
            <select id="productStatus" name="is_active">
                <option value="true">✅ В продаже</option>
                <option value="false">❌ Снят с продажи</option>
            </select>
        </div>
        <button type="submit" id="btnAddProduct" class="btn-action btn-edit">Добавить товар</button>
    <!-- <button type="submit" id="btnAddClient" class="btn-action btn-edit">Добавить</button> -->
    </form>
    
    <div id="message"></div>
    
    <!-- Таблица товаров -->
    <h2>Список товаров</h2>
    <table id="productList">
        <thead>
            <tr>
                <th>SKU</th>
                <th>Категория</th>
                <th>Название</th>
                <th>Цена</th>
                <th>Остаток</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Модальное окно редактирования (аналогично clients.html) -->
    <div id="editModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; margin: 50px auto; padding: 20px; border-radius: 8px; width: 500px; max-width: 95%;">
            <h3>Редактировать товар</h3>
            <input type="hidden" id="editProductId">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Категория:</label>
                    <input type="text" id="editCategory" style="width: 100%;">
                </div>
                <div>
                    <label>SKU (авто):</label>
                    <input type="text" id="editSku" readonly style="width: 100%; background: #f5f5f5;">
                </div>
            </div>
            <div style="margin: 10px 0;">
                <label>Название:</label>
                <input type="text" id="editName" style="width: 100%;">
            </div>
            <div style="margin: 10px 0;">
                <label>Описание:</label>
                <textarea id="editDescription" style="width: 100%;"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>Цена:</label>
                    <input type="number" id="editPrice" step="0.01" style="width: 100%;">
                </div>
                <div>
                    <label>Остаток:</label>
                    <input type="number" id="editQuantity" min="0" style="width: 100%;">
                </div>
            </div>
            <div style="margin: 10px 0;">
                <label>Статус:</label>
                <select id="editStatus">
                    <option value="true">✅ В продаже</option>
                    <option value="false">❌ Снят с продажи</option>
                </select>
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <button id="btnCloseModal" class="btn-action">Отмена</button>
                <button id="btnSaveEdit" class="btn-action btn-edit">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/product.js"></script>
    <script type="module" src="js/main.js"></script>
    
    <!-- Логика страницы -->
    <script type="module">
        import { 
            loadProductList, 
            handleProductFormSubmit, 
            deleteProduct, 
            updateProduct,
            generateSKU
        } from './js/product.js';
        
        if (typeof Neutralino !== 'undefined') Neutralino.init();
        
        // Глобальные функции для HTML
        window.renderProductTable = renderProductTable;
        window.deleteProductById = deleteProductById;
        window.editProduct = editProduct;
        window.closeEditModal = closeEditModal;
        window.saveEditProduct = saveEditProduct;
        window.updateClient = window.updateClient || null; // из client.js, если нужно
        
        document.addEventListener('DOMContentLoaded', async () => {
            // Ждём готовности БД
            await waitForDatabase();
            await loadAndRender();
            setupEventDelegation();
        });
        
        async function waitForDatabase() {
            if (window.isDatabaseReady) return;
            return new Promise(resolve => {
                const check = () => {
                    if (window.isDatabaseReady) resolve();
                    else setTimeout(check, 50);
                };
                check();
            });
        }
        
        async function loadAndRender() {
            try {
                const products = await loadProductList();
                renderProductTable(products);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        // Обработчик формы
        document.getElementById('productForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnAddProduct');
            if (btn.disabled) return;
            
            btn.disabled = true;
            btn.textContent = '⏳ Добавление...';
            
            try {
                const formData = {
                    category: document.getElementById('productCategory').value,
                    name: document.getElementById('productName').value,
                    description: document.getElementById('productDescription').value,
                    price: document.getElementById('productPrice').value,
                    quantity: document.getElementById('productQuantity').value,
                    is_active: document.getElementById('productStatus').value
                };
                
                await handleProductFormSubmit(formData);
                
                // Сохраняем бэкап
                if (window.saveDataToFile) await window.saveDataToFile();
                
                // Сброс формы
                e.target.reset();
                
                // Обновление таблицы
                const products = await loadProductList();
                renderProductTable(products);
                
            } catch (error) {
                alert('Ошибка: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Добавить товар';
            }
        });
        
        // Рендер таблицы
        function renderProductTable(products) {
            const tbody = document.querySelector('#productList tbody');
            if (!tbody) return;
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">Нет товаров</td></tr>';
                return;
            }
            
            tbody.innerHTML = products.map(p => `
                <tr data-product-id="${p.id}">
                    <td><strong>${p.sku || '-'}</strong></td>
                    <td>${p.category || ''}</td>
                    <td>${p.name || ''}</td>
                    <td>${p.price?.toFixed(2) || '0.00'} ₽</td>
                    <td>${p.quantity || 0}</td>
                    <td>${p.is_active ? '✅' : '❌'}</td>
                    <td>
                        <button class="btn-action btn-edit" data-action="edit">✏️</button>
                        <button class="btn-action btn-delete" data-action="delete">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // Делегирование событий
        function setupEventDelegation() {
            document.getElementById('productList')?.addEventListener('click', async (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                
                const row = btn.closest('tr');
                const id = parseInt(row?.dataset?.productId);
                const action = btn.dataset.action;
                
                if (!id) return;
                
                try {
                    if (action === 'edit') {
                        const cells = row.querySelectorAll('td');
                        editProduct(id, {
                            category: cells[1].textContent,
                            name: cells[2].textContent,
                            price: parseFloat(cells[3].textContent) || 0,
                            quantity: parseInt(cells[4].textContent) || 0,
                            is_active: cells[5].textContent === '✅',
                            sku: row.querySelector('strong').textContent,
                            description: '' // нужно загрузить из БД для полного редактирования
                        });
                    }
                    else if (action === 'delete') {
                        await deleteProductById(id);
                    }
                } catch (error) {
                    alert('Ошибка: ' + error.message);
                }
            });
        }
        
        // Удаление
        async function deleteProductById(id) {
            if (!confirm('Удалить этот товар?')) return;
            await deleteProduct(id);
            if (window.saveDataToFile) await window.saveDataToFile();
            const products = await loadProductList();
            renderProductTable(products);
        }
        
        // Редактирование
        function editProduct(id, data) {
            document.getElementById('editProductId').value = id;
            document.getElementById('editCategory').value = data.category || '';
            document.getElementById('editSku').value = data.sku || generateSKU(data.category, id);
            document.getElementById('editName').value = data.name || '';
            document.getElementById('editDescription').value = data.description || '';
            document.getElementById('editPrice').value = data.price || 0;
            document.getElementById('editQuantity').value = data.quantity || 0;
            document.getElementById('editStatus').value = data.is_active ? 'true' : 'false';
            document.getElementById('editModal').style.display = 'block';
        }
        
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        
        async function saveEditProduct() {
            const id = parseInt(document.getElementById('editProductId').value);
            const data = {
                category: document.getElementById('editCategory').value,
                name: document.getElementById('editName').value,
                description: document.getElementById('editDescription').value,
                price: parseFloat(document.getElementById('editPrice').value) || 0,
                quantity: parseInt(document.getElementById('editQuantity').value) || 0,
                is_active: document.getElementById('editStatus').value === 'true'
            };
            
            try {
                await updateProduct(id, data);
                if (window.saveDataToFile) await window.saveDataToFile();
                closeEditModal();
                const products = await loadProductList();
                renderProductTable(products);
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }
        
        // Обработчики модального окна
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnCloseModal')?.addEventListener('click', closeEditModal);
            document.getElementById('btnSaveEdit')?.addEventListener('click', saveEditProduct);
            document.getElementById('editModal')?.addEventListener('click', (e) => {
                if (e.target.id === 'editModal') closeEditModal();
            });
            
            // Автообновление SKU при изменении категории
            document.getElementById('editCategory')?.addEventListener('input', (e) => {
                const id = parseInt(document.getElementById('editProductId').value);
                const sku = generateSKU(e.target.value, id);
                document.getElementById('editSku').value = sku;
            });
        });
    </script>
</body>
</html>
