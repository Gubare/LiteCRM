<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Товары - CRM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
        <!-- Навигация -->
    <nav class="main-nav">
    <a href="index.html"><span class="nav-icon">🏠</span> <span class="nav-text">Главная</span></a>
    <a href="clients.html"><span class="nav-icon">👥</span> <span class="nav-text">Клиенты</span></a>
    <a href="products.html"><span class="nav-icon">📦</span> <span class="nav-text">Товары</span></a>
    <a href="tickets.html"><span class="nav-icon">🎫</span> <span class="nav-text">Обращения</span></a>
    <a href="reports.html"><span class="nav-icon">📈</span> <span class="nav-text">Отчёты</span></a>
    <a href="sales.html"><span class="nav-icon">💰</span> <span class="nav-text">Продажи</span></a>
    <a href="settings.html"><span class="nav-icon">⚙️</span> <span class="nav-text">Настройки</span></a>
    <a href="calendar.html"><span class="nav-icon">📅</span> <span class="nav-text">Календарь</span></a>
    <a href="charts.html"><span class="nav-icon">📊</span> <span class="nav-text">Графики</span></a>
    </nav>  

    <main class="page-content">
        <h1>Управление товарами</h1>
        
        <!-- Кнопка создания -->
        <div style="margin-bottom: 20px;">
            <button class="btn-primary" onclick="openModal('createProductModal')" style="padding: 10px 20px; font-size: 15px;">
                📦 Добавить товар
            </button>
        </div>
        
        <!-- Панель управления -->
        <div class="table-toolbar">
            <div class="toolbar-filters">
                <select id="filterCategory" class="form-control" style="width: 160px;">
                    <option value="">Все категории</option>
                </select>
                
                <input type="text" id="filterName" class="form-control" placeholder="Поиск по названию" style="width: 200px;">
                
                <select id="filterStatus" class="form-control" style="width: 140px;">
                    <option value="">Все статусы</option>
                    <option value="active">В продаже</option>
                    <option value="inactive">Снят</option>
                </select>
                
                <button id="btnApplyFilters" class="btn-primary" style="width: auto; padding: 8px 16px;">Применить</button>
                <button id="btnResetFilters" class="btn-action-icon" style="width: auto; padding: 8px 16px;">Сброс</button>
            </div>
            
            <div class="toolbar-pagination">
                <label style="font-size: 13px; color: #64748b;">Записей:</label>
                <select id="pageSize" class="form-control" style="width: 70px;">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>
        
        <!-- Панель массовых действий -->
        <div id="bulkActionBar" class="bulk-action-bar">
            <span>Выбрано записей: <span class="count-badge" id="selectedCount">0</span></span>
            <button id="btnBulkEdit" class="btn-action-icon" disabled onclick="editSelected()">✏️ Изменить</button>
            <button id="btnBulkDelete" class="btn-action-icon delete" onclick="deleteSelected()">🗑️ Удалить</button>
            <button class="btn-action-icon" onclick="clearSelection()" style="margin-left:auto; font-size:12px; color:#64748b;">✕ Снять выделение</button>
        </div>
        
        <!-- Таблица -->
        <table id="productTable" class="crm-table">
            <thead>
                <tr>
                    <th>SKU</th>
                    <th>Категория</th>
                    <th>Название</th>
                    <th>Цена</th>
                    <th>Остаток</th>
                    <th>Статус</th>
                    <!-- <th>Действия</th> -->
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
            <!-- Пагинация -->
            <div class="pagination-container">
                <div id="pagination" class="pagination"></div>
                <span id="paginationInfo"></span>
            </div>
    </main>

    <!-- Модальное окно: Создание товара -->
    <div id="createProductModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'createProductModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">📦 Новый товар</h3>
            </div>
            <form id="createProductForm">
                <div class="form-row">
                    <!-- <div>
                        <label>SKU (артикул) *:</label>
                        <input type="text" id="productSku" class="form-control" style="width: 100%;" required placeholder="TE-1">
                    </div> -->
                    <div>
                        <label>Категория *:</label>
                        <input type="text" id="productCategory" list="categoryListCreate" 
                            class="form-control" style="width: 100%;" required 
                            placeholder="Выберите или введите свою">
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Название *:</label>
                        <input type="text" id="productName" class="form-control" style="width: 100%;" required placeholder="iPhone 15">
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Описание:</label>
                        <textarea id="productDescription" rows="3" placeholder="Характеристики товара..."></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Цена *:</label>
                        <input type="number" id="productPrice" class="form-control" style="width: 100%;" required min="0" step="0.01" placeholder="9999.99">
                    </div>
                    <div>
                        <label>Количество *:</label>
                        <input type="number" id="productQuantity" class="form-control" style="width: 100%;" required min="0" placeholder="10">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="productStatus" class="form-control" style="width: 100%;">
                            <option value="active">В продаже</option>
                            <option value="inactive">Снят</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('createProductModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Добавить товар</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно: Редактирование -->
    <div id="editProductModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'editProductModal')">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="margin: 0;">✏️ Редактирование товара</h3>
            </div>
            <form id="editProductForm">
                <input type="hidden" id="editProductId">
                <div class="form-row">
                    <div>
                        <label>SKU (артикул):</label>
                        <input type="text" id="editProductSku" class="form-control" style="width: 100%;" readonly>
                    </div>
                    <div>
                        <label>Категория:</label>
                        <input type="text" id="editProductCategory" list="categoryListEdit" 
                            class="form-control" style="width: 100%;" 
                            placeholder="Выберите или введите свою">
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Название:</label>
                        <input type="text" id="editProductName" class="form-control" style="width: 100%;">
                    </div>
                </div>
                <div class="form-row full">
                    <div>
                        <label>Описание:</label>
                        <textarea id="editProductDescription" rows="3"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Цена:</label>
                        <input type="number" id="editProductPrice" class="form-control" style="width: 100%;" step="0.01">
                    </div>
                    <div>
                        <label>Количество:</label>
                        <input type="number" id="editProductQuantity" class="form-control" style="width: 100%;">
                    </div>
                    <div>
                        <label>Статус:</label>
                        <select id="editProductStatus" class="form-control" style="width: 100%;">
                            <option value="active">В продаже</option>
                            <option value="inactive">Снят</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-action-icon" onclick="closeModal('editProductModal')" style="flex: 1; padding: 10px;">Отмена</button>
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 10px;">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Контекстное меню -->
    <div id="ctxMenu" class="ctx-menu">
        <button class="ctx-menu-item" id="ctxEdit" onclick="ctxEditAction()">
            <span>✏️</span> Редактировать
        </button>
        <div class="ctx-divider"></div>
        <button class="ctx-menu-item danger" id="ctxDelete" onclick="ctxDeleteAction()">
            <span>🗑️</span> Удалить
        </button>
    </div>

    <script src="js/neutralino.js"></script>
    <script type="module" src="js/db_indexeddb.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/products.js"></script>
</body>
</html>
