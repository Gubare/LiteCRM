<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обращения | RetailCRM Mockup</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-app: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        
        body { display: flex; height: 100vh; background-color: var(--bg-app); color: var(--text-main); }

        /* Sidebar */
        .sidebar { width: 70px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; align-items: center; padding-top: 20px; flex-shrink: 0; }
        .sidebar-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--sidebar-text); margin-bottom: 15px; cursor: pointer; transition: 0.2s; font-size: 1.2rem; text-decoration: none; }
        .sidebar-icon:hover, .sidebar-icon.active { background-color: #334155; color: #fff; }
        .sidebar-icon.active { border-left: 3px solid var(--primary); }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .header-title { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .actions { display: flex; gap: 10px; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-icon { padding: 6px; border-radius: 4px; border: none; cursor: pointer; background: transparent; color: var(--text-secondary); }
        .btn-icon:hover { background: #f3f4f6; color: var(--primary); }

        /* Workspace */
        .workspace { flex: 1; padding: 24px; overflow-y: auto; }
        
        /* Filter Bar */
        .filter-bar { background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
        .filter-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; min-width: 140px; }

        /* Table */
        .table-container { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; background: #f9fafb; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; font-size: 0.85rem; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
        tr:hover { background: #f9fafb; }
        tr:last-child td { border-bottom: none; }
        
        /* Badges */
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; display: inline-block; }
        .badge-success { background: #ecfdf5; color: var(--success); }
        .badge-warning { background: #fffbeb; color: var(--warning); }
        .badge-grey { background: #f3f4f6; color: #6b7280; }
        .badge-info { background: #eff6ff; color: var(--info); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal { background: #fff; width: 650px; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; transform: translateY(10px); transition: transform 0.2s; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: #f9fafb; border-radius: 0 0 8px 8px; }

        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full-width { grid-column: span 2; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        .form-textarea { resize: vertical; min-height: 100px; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .checkbox-wrapper { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .checkbox-wrapper input { width: 18px; height: 18px; cursor: pointer; }

        /* Reply Preview */
        .reply-preview { background: #f8fafc; padding: 15px; border-radius: 6px; border-left: 4px solid var(--primary); margin-bottom: 20px; }
        .reply-preview h4 { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 5px; }
        .reply-preview p { font-size: 0.95rem; margin-bottom: 4px; }
        .reply-preview strong { color: var(--text-main); }

        /* Toast Notification */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; animation: slideIn 0.3s ease-out; z-index: 200; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 50px; }
            .workspace { padding: 16px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .modal { width: 95%; }
        }
    </style>
</head>

    <main class="main">
        <!-- Header -->
        <header class="header">
            <div class="header-title">Обращения клиентов</div>
            <div class="actions">
                <button class="btn btn-primary" onclick="openNewInquiryModal()">+ Новая заявка</button>
            </div>
        </header>

        <!-- Workspace -->
        <div class="workspace">
            
            <!-- Filter Bar -->

                <input type="text" class="search-input" placeholder="Поиск по клиенту или описанию..." id="searchInput" oninput="renderInquiries()">
                <select class="filter-select" id="statusFilter" onchange="renderInquiries()">
                    <option value="all">Все статусы</option>
                    <option value="open">Открытые</option>
                    <option value="done">Выполненные</option>
                    <option value="archived">Архив</option>
                </select>
                <select class="filter-select" id="typeFilter" onchange="renderInquiries()">
                    <option value="all">Все типы</option>
                    <option value="Вопрос">Вопрос</option>
                    <option value="Жалоба">Жалоба</option>
                    <option value="Заказ">Заказ</option>

                            <th>Дата создания</th>
                            <th>Статус</th>
                            <th>Канал ответа</th>
                            <th style="width: 120px;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="inquiriesTableBody">
                        <!-- JS renders rows here -->
                    </tbody>
                </table>
            </div>
        </div>

    <!-- Modal: New Inquiry -->

            <div class="modal-header">
                <h3>Регистрация новой заявки</h3>
                <button class="btn-icon" onclick="closeNewInquiryModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="inquiryForm">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label class="form-label">Клиент *</label>
                            <select id="inquiryClient" class="form-select" required>
                                <option value="">Выберите клиента</option>
                                <option value="1">Иванов Иван Иванович</option>
                                <option value="2">ООО 'Ромашка'</option>
                                <option value="3">Петров Петр</option>
                                <option value="4">Сидорова Анна</option>
                                <option value="new">+ Создать нового клиента</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Тип обращения *</label>
                            <select id="inquiryType" class="form-select" required>
                                <option value="Вопрос">Вопрос</option>
                                <option value="Жалоба">Жалоба</option>
                                <option value="Заказ">Заказ</option>
                                <option value="Консультация">Консультация</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Контакт для ответа</label>

                        </div>
                        <div class="form-group full-width">
                            <label class="form-label">Описание проблемы / вопроса *</label>
                            <textarea id="inquiryDesc" class="form-textarea" required placeholder="Подробное описание обращения..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeNewInquiryModal()">Отмена</button>
                <button class="btn btn-primary" onclick="submitNewInquiry()">Зарегистрировать</button>
            </div>
        </div>
    </div>

    <!-- Modal: Reply to Inquiry -->
    <div class="modal-overlay" id="replyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Формирование ответа</h3>
                <button class="btn-icon" onclick="closeReplyModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="reply-preview">
                    <h4>Исходная заявка #<span id="replyIdDisplay"></span></h4>
                    <p><strong>Клиент:</strong> <span id="replyClientDisplay"></span></p>
                    <p><strong>Тип:</strong> <span id="replyTypeDisplay"></span></p>
                    <p><strong>Текст:</strong> <span id="replyDescDisplay"></span></p>
                </div>
                
                <form id="replyForm">
                    <input type="hidden" id="replyInquiryId">
                    <div class="form-group">
                        <label class="form-label">Текст ответа</label>
                        <textarea id="replyText" class="form-textarea" placeholder="Введите текст ответа клиенту..."></textarea>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Канал обратной связи</label>
                            <select id="replyChannel" class="form-select">
                                <option value="Email">Email</option>
                                <option value="SMS">SMS</option>
                                <option value="Телефон">Телефонный звонок</option>

                            <label class="form-label">Действие</label>

                                <label for="replyMarkDone">Отметить как выполненную</label>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeReplyModal()">Отмена</button>
                <button class="btn btn-primary" onclick="submitReply()"> Отправить ответ</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // --- MOCK DATA ---
        let inquiries = [
            { id: 1, client_id: 1, client_name: "Иванов Иван Иванович", contact_type: "Вопрос", description: "Интересует наличие товара X на складе. Когда ожидается поставка?", contact_info: "ivan@example.com", created_at: "2024-05-10 14:20", is_done: false, is_archived: false, reply_channel: null },
            { id: 2, client_id: 2, client_name: "ООО 'Ромашка'", contact_type: "Жалоба", description: "Доставка задержалась на 2 дня. Требуется компенсация или скидка на следующий заказ.", contact_info: "info@romashka.ru", created_at: "2024-05-12 09:15", is_done: true, is_archived: false, reply_channel: "Email" },
            { id: 3, client_id: 4, client_name: "Сидорова Анна", contact_type: "Заказ", description: "Хочу оформить предзаказ на партию товара Y. Свяжитесь для уточнения условий.", contact_info: "+7 (926) 888-99-00", created_at: "2024-05-14 11:30", is_done: false, is_archived: false, reply_channel: null },
            { id: 4, client_id: 1, client_name: "Иванов Иван Иванович", contact_type: "Консультация", description: "Нужна помощь с настройкой интеграции с 1С.", contact_info: "ivan@example.com", created_at: "2024-05-01 10:00", is_done: true, is_archived: true, reply_channel: "Телефон" }
        ];

        // --- RENDER LOGIC ---
        function renderInquiries() {
            const tbody = document.getElementById('inquiriesTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            
            tbody.innerHTML = '';

            const filtered = inquiries.filter(i => {
                const matchesSearch = i.client_name.toLowerCase().includes(searchVal) || 
                                      i.description.toLowerCase().includes(searchVal);
                const matchesType = typeFilter === 'all' || i.contact_type === typeFilter;
                
                let matchesStatus = true;
                if (statusFilter === 'open') matchesStatus = !i.is_done && !i.is_archived;
                if (statusFilter === 'done') matchesStatus = i.is_done && !i.is_archived;
                if (statusFilter === 'archived') matchesStatus = i.is_archived;

                return matchesSearch && matchesType && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999; padding: 20px;">Заявки не найдены</td></tr>';
                return;
            }

            filtered.forEach(inq => {
                const tr = document.createElement('tr');
                
                // Status Badge
                let statusBadge = '';
                if (inq.is_archived) {
                    statusBadge = '<span class="badge badge-grey">Архив</span>';
                    tr.style.opacity = '0.6';
                } else if (inq.is_done) {
                    statusBadge = '<span class="badge badge-success">Выполнена</span>';
                } else {
                    statusBadge = '<span class="badge badge-warning">Открыта</span>';
                }

                // Channel Badge
                const channelBadge = inq.reply_channel ? `<span class="badge badge-info">${inq.reply_channel}</span>` : '<span style="color: #999;">—</span>';

                tr.innerHTML = `
                    <td style="color: var(--text-secondary);">#${inq.id}</td>
                    <td>
                        <div style="font-weight: 500;">${inq.client_name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${inq.contact_info}</div>
                    </td>
                    <td>${inq.contact_type}</td>
                    <td style="color: var(--text-secondary);">${new Date(inq.created_at).toLocaleString('ru-RU')}</td>
                    <td>${statusBadge}</td>
                    <td>${channelBadge}</td>
                    <td>
                        ${!inq.is_archived && !inq.is_done ? `<button class="btn-icon" onclick="openReplyModal(${inq.id})" title="Ответить">Ответить</button>` : ''}
                        ${!inq.is_archived ? `<button class="btn-icon" onclick="archiveInquiry(${inq.id})" title="В архив">Архивировать</button>` : ''}
                        <button class="btn-icon" onclick="viewInquiry(${inq.id})" title="Просмотр">Просмотреть</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- MODAL LOGIC: NEW INQUIRY ---
        function openNewInquiryModal() {
            document.getElementById('newInquiryModal').classList.add('active');
            document.getElementById('inquiryForm').reset();
        }

        function closeNewInquiryModal() {
            document.getElementById('newInquiryModal').classList.remove('active');
        }

        function submitNewInquiry() {
            const clientId = document.getElementById('inquiryClient').value;
            const type = document.getElementById('inquiryType').value;
            const contact = document.getElementById('inquiryContact').value;
            const desc = document.getElementById('inquiryDesc').value;

            if (!clientId || !desc) {
                alert('Заполните обязательные поля: Клиент и Описание');
                return;
            }
            if (clientId === 'new') {
                alert('Переход к форме создания клиента (UC-2)');
                return;
            }

            // Get client name from select text
            const clientSelect = document.getElementById('inquiryClient');
            const clientName = clientSelect.options[clientSelect.selectedIndex].text;

            const newId = inquiries.length > 0 ? Math.max(...inquiries.map(i => i.id)) + 1 : 1;
            inquiries.unshift({
                id: newId,
                client_id: parseInt(clientId),
                client_name: clientName,
                contact_type: type,
                description: desc,
                contact_info: contact || '—',
                created_at: new Date().toISOString(),
                is_done: false,
                is_archived: false,
                reply_channel: null
            });

            closeNewInquiryModal();
            renderInquiries();
            showToast(`Заявка #${newId} зарегистрирована. Запись добавлена в contactLog`);
            logAuditAction(`INSERT into contactLog (id: ${newId}, client: ${clientName})`);
        }

        // --- MODAL LOGIC: REPLY ---
        function openReplyModal(id) {
            const inq = inquiries.find(i => i.id === id);
            if (!inq) return;

            document.getElementById('replyInquiryId').value = id;
            document.getElementById('replyIdDisplay').innerText = inq.id;
            document.getElementById('replyClientDisplay').innerText = inq.client_name;
            document.getElementById('replyTypeDisplay').innerText = inq.contact_type;
            document.getElementById('replyDescDisplay').innerText = inq.description;
            document.getElementById('replyText').value = '';
            document.getElementById('replyMarkDone').checked = true;

            document.getElementById('replyModal').classList.add('active');
        }

        function closeReplyModal() {
            document.getElementById('replyModal').classList.remove('active');
        }

        function submitReply() {
            const id = parseInt(document.getElementById('replyInquiryId').value);
            const text = document.getElementById('replyText').value;
            const channel = document.getElementById('replyChannel').value;
            const markDone = document.getElementById('replyMarkDone').checked;

            if (!text) {
                alert('Введите текст ответа');
                return;
            }

            const idx = inquiries.findIndex(i => i.id === id);
            if (idx !== -1) {
                inquiries[idx].is_done = markDone;
                inquiries[idx].reply_channel = channel;
                // In real app: UPDATE contactLog SET is_done=?, reply_channel=?, reply_text=? WHERE id=?
                closeReplyModal();
                renderInquiries();
                showToast(`Ответ отправлен через ${channel}. Заявка #${id} обновлена.`);
                logAuditAction(`UPDATE contactLog (id: ${id}) -> is_done=${markDone}, channel=${channel}`);
            }
        }

        // --- UTILS ---
        function archiveInquiry(id) {
            const inq = inquiries.find(i => i.id === id);
            if (inq && confirm(`Переместить заявку #${id} в архив?`)) {
                inq.is_archived = true;
                renderInquiries();
                showToast(`Заявка #${id} перемещена в архив`);
                logAuditAction(`UPDATE contactLog (id: ${id}) -> is_archived=true`);
            }
        }

        function viewInquiry(id) {
            const inq = inquiries.find(i => i.id === id);
            alert(`Просмотр заявки #${inq.id}\nКлиент: ${inq.client_name}\nТип: ${inq.contact_type}\nОписание: ${inq.description}\nСтатус: ${inq.is_done ? 'Выполнена' : 'Открыта'}`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function logAuditAction(action) {
            console.log(`[AUDIT_LOG] ${new Date().toISOString()} | ${action}`);
            // In real app: INSERT INTO audit_log ...
        }

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // Init
        renderInquiries();
    </script>
</body>
</html>
