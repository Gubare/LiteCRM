<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары | RetailCRM Mockup</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-app: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        
        body { display: flex; height: 100vh; background-color: var(--bg-app); color: var(--text-main); }

        /* Sidebar */
        .sidebar { width: 70px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; align-items: center; padding-top: 20px; flex-shrink: 0; }
        .sidebar-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--sidebar-text); margin-bottom: 15px; cursor: pointer; transition: 0.2s; font-size: 1.2rem; text-decoration: none; }
        .sidebar-icon:hover, .sidebar-icon.active { background-color: #334155; color: #fff; }
        .sidebar-icon.active { border-left: 3px solid var(--primary); }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        .header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .header-title { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .actions { display: flex; gap: 10px; }
        
        /* Buttons */
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f9fafb; }
        .btn-icon { padding: 6px; border-radius: 4px; border: none; cursor: pointer; background: transparent; color: var(--text-secondary); }
        .btn-icon:hover { background: #f3f4f6; color: var(--primary); }

        /* Workspace */
        .workspace { flex: 1; padding: 24px; overflow-y: auto; }
        
        /* Filter Bar */
        .filter-bar { background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; }
        .filter-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: #fff; min-width: 140px; }

        /* Table */
        .table-container { background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; background: #f9fafb; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; font-size: 0.85rem; }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
        tr:hover { background: #f9fafb; }
        tr:last-child td { border-bottom: none; }
        
        /* Badges & Tags */
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 500; display: inline-block; }
        .badge-success { background: #ecfdf5; color: var(--success); }
        .badge-grey { background: #f3f4f6; color: #6b7280; }
        .badge-danger { background: #fef2f2; color: var(--danger); }
        .badge-info { background: #eff6ff; color: var(--primary); }
        
        .stock-indicator { font-weight: bold; }
        .stock-critical { color: var(--danger); background: #fef2f2; padding: 2px 6px; border-radius: 4px; }
        .stock-ok { color: var(--success); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal { background: #fff; width: 600px; border-radius: 8px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; transform: translateY(10px); transition: transform 0.2s; }
        .modal-overlay.active .modal { transform: translateY(0); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: #f9fafb; border-radius: 0 0 8px 8px; }

        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full-width { grid-column: span 2; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .form-input, .form-textarea, .form-select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* History List in Modal */
        .history-list { list-style: none; }
        .history-item { padding: 10px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-size: 0.8rem; color: var(--text-secondary); }
        .history-client { font-weight: 500; }

        /* Toast Notification */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; animation: slideIn 0.3s ease-out; z-index: 200; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 50px; }
            .workspace { padding: 16px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .modal { width: 95%; }
        }
    </style>
</head>

    </aside>

    <main class="main">
        <!-- Header -->
        <header class="header">
            <div class="header-title">Справочник товаров</div>
            <div class="actions">
                <button class="btn btn-primary" onclick="openProductModal()">+ Добавить товар</button>
            </div>
        </header>

        <!-- Workspace -->
        <div class="workspace">
            
            <!-- Filter Bar -->
            <div class="filter-bar">
                <input type="text" class="search-input" placeholder="Поиск по названию или артикулу..." id="searchInput" oninput="renderProducts()">
                <select class="filter-select" id="stockFilter" onchange="renderProducts()">
                    <option value="all">Все товары</option>
                    <option value="low">Заканчивается</option>
                    <option value="active">В наличии</option>
                </select>
            </div>

            <!-- Products Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Название</th>
                            <th>Артикул</th>
                            <th>Цена</th>
                            <th>Остаток</th>
                            <th>Статус</th>
                            <th style="width: 140px;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- JS renders rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Add/Edit Product -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Новый товар</h3>
                <button class="btn-icon" onclick="closeProductModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label class="form-label">Название товара *</label>
                            <input type="text" id="productName" class="form-input" required placeholder="Смартфон X100">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Артикул (SKU)</label>
                            <input type="text" id="productSku" class="form-input" placeholder="ART-001">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Цена (₽)</label>
                            <input type="number" id="productPrice" class="form-input" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Текущий остаток</label>
                            <input type="number" id="productStock" class="form-input" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Порог уведомления</label>
                            <input type="number" id="productThreshold" class="form-input" value="5">
                            <div class="form-hint">Уведомлять, если остаток ниже этого значения</div>
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label">Описание</label>
                            <textarea id="productDesc" class="form-textarea" placeholder="Характеристики товара..."></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeProductModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveProduct()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Modal: Product History (Related Inquiries) -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h3>История: <span id="historyProductName" style="color: var(--primary);"></span></h3>
                <button class="btn-icon" onclick="closeHistoryModal()">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px; color: var(--text-secondary);">Заявки и обращения, связанные с этим товаром (UC-4 &rarr; UC-5):</p>
                <ul class="history-list" id="historyList">
                    <!-- JS populates this -->
                </ul>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeHistoryModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // --- MOCK DATA ---
        let products = [
            { id: 1, name: "Смартфон X100", sku: "PH-100", price: 25000, stock: 12, threshold: 5, is_active: true, description: "Флагманская модель" },
            { id: 2, name: "Чехол силиконовый", sku: "ACC-50", price: 500, stock: 2, threshold: 5, is_active: true, description: "Прозрачный, прочный" },
            { id: 3, name: "Ноутбук Pro 15", sku: "LT-200", price: 85000, stock: 0, threshold: 2, is_active: false, description: "Для профессионалов" },
            { id: 4, name: "Наушники Bluetooth", sku: "AUD-30", price: 3500, stock: 45, threshold: 10, is_active: true, description: "С шумоподавлением" }
        ];

        // Mock Inquiries for History (Connection UC-4 -> UC-5)
        const inquiries = [
            { id: 101, client: "Иванов И.И.", date: "2024-05-10", type: "Заказ", text: "Хочу заказать 2 шт. Смартфон X100" },
            { id: 102, client: "Сидорова А.", date: "2024-05-12", type: "Вопрос", text: "Есть ли в наличии Чехол силиконовый?" },
            { id: 103, client: "ООО Ромашка", date: "2024-05-14", type: "Заказ", text: "Оптовая партия: Смартфон X100 (5 шт)" }
        ];

        let currentProductId = null;

        // --- RENDER LOGIC ---
        function renderProducts() {
            const tbody = document.getElementById('productsTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const stockFilter = document.getElementById('stockFilter').value;
            
            tbody.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || 
                                      (p.sku && p.sku.toLowerCase().includes(searchVal));
                
                let matchesStock = true;
                if (stockFilter === 'low') matchesStock = p.stock < p.threshold && p.is_active;
                if (stockFilter === 'active') matchesStock = p.stock > 0 && p.is_active;

                return matchesSearch && matchesStock;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999; padding: 20px;">Товары не найдены</td></tr>';
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                if (!p.is_active) tr.style.opacity = '0.6';
                
                // Stock Badge Logic
                let stockHtml = '';
                if (p.stock < p.threshold) {
                    stockHtml = `<span class="stock-critical">${p.stock} шт.</span>`;
                } else {
                    stockHtml = `<span class="stock-ok">${p.stock} шт.</span>`;
                }

                // Status Badge
                let statusBadge = p.is_active ? '<span class="badge badge-success">Активен</span>' : '<span class="badge badge-grey">Не активен</span>';

                tr.innerHTML = `
                    <td style="color: var(--text-secondary);">#${p.id}</td>
                    <td>
                        <div style="font-weight: 500;">${p.name}</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${p.description || ''}</div>
                    </td>
                    <td style="font-family: monospace;">${p.sku || '—'}</td>
                    <td style="font-weight: 600;">${p.price.toLocaleString()} ₽</td>
                    <td>${stockHtml}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn-icon" onclick="openProductModal(${p.id})" title="Редактировать">Редактировать</button>
                        <button class="btn-icon" onclick="openHistoryModal(${p.id})" title="История / Заявки">История</button>
                        <button class="btn-icon" onclick="toggleProductStatus(${p.id})" title="${p.is_active ? 'Деактивировать' : 'Активировать'}">${p.is_active ? 'Присотановить' : 'Возобновить'}</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- MODAL LOGIC: PRODUCT ---
        function openProductModal(id = null) {
            document.getElementById('productModal').classList.add('active');
            if (id) {
                const p = products.find(i => i.id === id);
                document.getElementById('modalTitle').innerText = 'Редактирование товара';
                document.getElementById('productId').value = p.id;
                document.getElementById('productName').value = p.name;
                document.getElementById('productSku').value = p.sku;
                document.getElementById('productPrice').value = p.price;
                document.getElementById('productStock').value = p.stock;
                document.getElementById('productThreshold').value = p.threshold;
                document.getElementById('productDesc').value = p.description || '';
                currentProductId = id;
            } else {
                document.getElementById('modalTitle').innerText = 'Новый товар';
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
                document.getElementById('productThreshold').value = 5;
                currentProductId = null;
            }
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        function saveProduct() {
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            if (!name || isNaN(price)) {
                alert('Заполните обязательные поля: Название и Цена');
                return;
            }

            const data = {
                name: name,
                sku: document.getElementById('productSku').value,
                price: price,
                stock: parseInt(document.getElementById('productStock').value) || 0,
                threshold: parseInt(document.getElementById('productThreshold').value) || 5,
                description: document.getElementById('productDesc').value
            };

            if (currentProductId) {
                const idx = products.findIndex(p => p.id === currentProductId);
                products[idx] = { ...products[idx], ...data };
                showToast(`Товар "${name}" обновлен`);
            } else {
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.unshift({ id: newId, ...data, is_active: true });
                showToast(`Товар "${name}" добавлен`);
            }

            closeProductModal();
            renderProducts();
        }

        function toggleProductStatus(id) {
            const p = products.find(i => i.id === id);
            if (p) {
                p.is_active = !p.is_active;
                renderProducts();
                showToast(p.is_active ? `▶️ Товар "${p.name}" активирован` : `⏸️ Товар "${p.name}" деактивирован`);
            }
        }

        // --- MODAL LOGIC: HISTORY (The "Interesting" Part) ---
        function openHistoryModal(productId) {
            const p = products.find(i => i.id === productId);
            if (!p) return;

            document.getElementById('historyProductName').innerText = p.name;
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            // Filter inquiries related to this product
            // In real app, this would be a JOIN query: SELECT * FROM inquiries JOIN ... WHERE product_id = X
            const relatedInquiries = inquiries.filter(i => i.text.toLowerCase().includes(p.name.toLowerCase()));

            if (relatedInquiries.length === 0) {
                list.innerHTML = '<li style="padding: 20px; text-align: center; color: #999;">Нет связанных обращений</li>';
            } else {
                relatedInquiries.forEach(i => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.innerHTML = `
                        <div>
                            <div class="history-client">${i.client}</div>
                            <div style="font-size: 0.9rem;">${i.text}</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="history-date">${i.date}</div>
                            <span class="badge badge-info" style="font-size: 0.7rem;">${i.type}</span>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            document.getElementById('historyModal').classList.add('active');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        // --- UTILS ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // Init
        renderProducts();
    </script>
</body>
</html>
